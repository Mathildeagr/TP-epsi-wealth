services:
  db:
    image: mysql:8.0
    container_name: espi-wealth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: espi_wealth
      MYSQL_USER: espi
      MYSQL_PASSWORD: espi_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: espi-wealth-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3307
      DB_NAME: espi_wealth
      DB_USER: espi
      DB_PASSWORD: espi_password
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
